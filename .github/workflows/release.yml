name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: cwt_log_analyser.exe
            asset_name: cwt_log_analyser-windows.exe
          - os: ubuntu-latest
            artifact_name: cwt_log_analyser
            asset_name: cwt_log_analyser-linux
          - os: macos-latest
            artifact_name: cwt_log_analyser
            asset_name: cwt_log_analyser-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mv cwt_log_analyser-windows.exe/cwt_log_analyser.exe cwt_log_analyser-windows.exe.tmp
          rm -rf cwt_log_analyser-windows.exe
          mv cwt_log_analyser-windows.exe.tmp cwt_log_analyser-windows.exe
          mv cwt_log_analyser-linux/cwt_log_analyser cwt_log_analyser-linux.tmp
          rm -rf cwt_log_analyser-linux
          mv cwt_log_analyser-linux.tmp cwt_log_analyser-linux
          mv cwt_log_analyser-macos/cwt_log_analyser cwt_log_analyser-macos.tmp
          rm -rf cwt_log_analyser-macos
          mv cwt_log_analyser-macos.tmp cwt_log_analyser-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cwt_log_analyser-windows.exe
            cwt_log_analyser-linux
            cwt_log_analyser-macos
          generate_release_notes: true
